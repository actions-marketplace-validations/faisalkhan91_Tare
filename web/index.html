<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tare</title>
    <!-- Pre-paint theme: a classic, render-blocking script (CSP-safe, not inline,
         not a module) resolves data-theme from the persisted preference + OS BEFORE the stylesheets
         paint, so there is no white/dark flash. -->
    <script src="./prepaint.js"></script>
    <link rel="stylesheet" href="./ui/tokens.css" />
    <link rel="stylesheet" href="./ui/fonts.css" />
    <link rel="stylesheet" href="./ui/app.css" />
    <link rel="stylesheet" href="./ui/shell.css" />
    <link rel="stylesheet" href="./ui/components.css" />
    <link rel="stylesheet" href="./ui/workspaces.css" />
  </head>
  <body>
    <!-- Static semantic startup shell: the workbench frame paints immediately (with
         the pre-resolved theme, no flash / no blank app) while data + preferences hydrate; mountApp
         clears #app and replaces it once ready. -->
    <div id="app">
      <div class="shell startup-shell" data-startup-shell aria-busy="true">
        <div class="brand">Tare</div>
        <header class="topbar"></header>
        <nav class="sidebar" aria-hidden="true"></nav>
        <main class="main"><p class="startup-hint">Loading…</p></main>
        <footer class="statusbar" aria-label="Workspace status"></footer>
      </div>
    </div>
    <!-- External module (not inline) so it works under a strict CSP. -->
    <script type="module" src="./boot.js"></script>
  </body>
</html>
