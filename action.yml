name: "Tare cost gate"
description: "Fail the build when estimated LLM/agent spend exceeds a cap or regresses vs a baseline. Estimates only."
branding:
  icon: "bar-chart-2"
  color: "blue"
inputs:
  db:
    description: "Path to the tare SQLite database produced by `tare run`."
    required: false
    default: "tare.db"
  max-spend:
    description: "Maximum estimated spend in USD (e.g. 0.50). Omit to skip the cap."
    required: false
  baseline:
    description: "Path to a baseline `tare report --json` file to compare against."
    required: false
  fail-on-regression:
    description: "Fail if total estimated spend regressed vs the baseline."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Run tare gate
      shell: bash
      env:
        DB: ${{ inputs.db }}
        MAX_SPEND: ${{ inputs.max-spend }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        cargo build --release -p tare-cli
        args=(gate --db "$DB")
        if [ -n "$MAX_SPEND" ]; then args+=(--max-spend "$MAX_SPEND"); fi
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ "$FAIL_ON_REGRESSION" = "true" ]; then args+=(--fail-on-regression); fi
        ./target/release/tare "${args[@]}"
