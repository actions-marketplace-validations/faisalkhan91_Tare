[package]
name = "tare-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tare_daemon"
path = "src/lib.rs"

[features]
# Off-box webhook sink (egress) — OUT of the offline gate, like `gui`. Tested only under
# `cargo test -p tare-daemon --features webhooks`.
webhooks = ["dep:reqwest"]

[dependencies]
tare-core = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = ["blocking", "native-tls"] }
