# FROZEN fixture pricing — drives all snapshot/golden tests.
# Decoupled from shipped pricing.json so updating real prices never breaks goldens.
# Rates are integer micro-USD per million tokens (1 USD = 1_000_000 micro-USD).
# Cache identities encoded as three input rates: read 0.1x, write-5m 1.25x, write-1h 2x.
version = "fixture-2026.06"
effective_date = "2026-06-01"

[[model]]
provider = "anthropic"
model_id = "claude-opus-4-8"
tier = "standard"
input_micro_per_mtok = 5000000
output_micro_per_mtok = 25000000
cache_read_micro_per_mtok = 500000
cache_write_5m_micro_per_mtok = 6250000
cache_write_1h_micro_per_mtok = 10000000

